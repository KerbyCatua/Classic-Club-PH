<!-- Open-Source Bootstrap Icons CDN -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
  /* Header micro-interactions */
  .cc-header-brand,
  .cc-nav-link,
  .cc-header-action,
  .cc-header-menu-toggle {
    -webkit-tap-highlight-color: transparent;
  }

  .cc-header-brand {
    transition: opacity 0.25s ease, transform 0.25s ease;
  }

  .cc-header-brand:hover {
    opacity: 0.86;
    transform: translateY(-1px);
  }

  .cc-nav-link {
    position: relative;
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    transition: color 0.25s ease, transform 0.25s ease;
  }

  .cc-nav-link::after {
    position: absolute;
    right: 0;
    bottom: 5px;
    left: 0;
    height: 1px;
    background-color: var(--cc-accent);
    content: '';
    transform: scaleX(0);
    transform-origin: center;
    transition: transform 0.25s ease;
  }

  .cc-nav-link:hover,
  .cc-nav-link:focus-visible {
    color: var(--cc-accent) !important;
    transform: translateY(-1px);
  }

  .cc-nav-link:hover::after,
  .cc-nav-link:focus-visible::after {
    transform: scaleX(1);
  }

  .cc-header-action {
    position: relative;
    min-width: 24px;
    min-height: 44px;
    justify-content: center;
    transition: color 0.25s ease, transform 0.25s ease;
  }

  .cc-header-action:hover,
  .cc-header-action:focus-visible {
    color: var(--cc-accent) !important;
    transform: translateY(-2px);
  }

  .cc-header-action i {
    transition: transform 0.25s ease;
  }

  .cc-header-action:hover i,
  .cc-header-action:focus-visible i {
    transform: scale(1.08);
  }

  .cc-header-action[href="/cart.html"] span {
    transition: color 0.25s ease, transform 0.25s ease;
  }

  .cc-header-action[href="/cart.html"]:hover span,
  .cc-header-action[href="/cart.html"]:focus-visible span {
    color: var(--cc-accent) !important;
    transform: translateX(1px);
  }

  .cc-header-menu-toggle {
    min-width: 44px;
    min-height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: color 0.25s ease, transform 0.25s ease;
  }

  .cc-header-menu-toggle:hover,
  .cc-header-menu-toggle:focus-visible {
    color: var(--cc-accent) !important;
    transform: translateY(-1px);
  }

  .cc-header-brand:focus-visible,
  .cc-nav-link:focus-visible,
  .cc-header-action:focus-visible,
  .cc-header-menu-toggle:focus-visible {
    outline: 2px solid var(--cc-accent);
    outline-offset: 4px;
  }

  @media (max-width: 991.98px) {
    .cc-nav-link {
      min-height: 40px;
    }

    .cc-nav-link::after {
      bottom: 2px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .cc-header-brand,
    .cc-nav-link,
    .cc-header-action,
    .cc-header-action i,
    .cc-header-action[href="/cart.html"] span,
    .cc-header-menu-toggle,
    .cc-nav-link::after {
      transition: none;
    }

    .cc-header-brand:hover,
    .cc-nav-link:hover,
    .cc-header-action:hover,
    .cc-header-action:hover i,
    .cc-header-menu-toggle:hover {
      transform: none;
    }
  }
</style>
