<!-- Open-Source Bootstrap Icons CDN -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
  /* Header micro-interactions */
  .cc-header-brand,
  .cc-nav-link,
  .cc-header-action,
  .cc-header-menu-toggle {
    -webkit-tap-highlight-color: transparent;
  }

  .cc-header-brand {
    transition: opacity 0.25s ease, transform 0.25s ease;
  }

  .cc-header-brand:hover {
    opacity: 0.86;
    transform: translateY(-1px);
  }

  .cc-nav-link {
    position: relative;
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    transition: color 0.25s ease, transform 0.25s ease;
  }

  .cc-nav-link::after {
    position: absolute;
    right: 0;
    bottom: 5px;
    left: 0;
    height: 1px;
    background-color: var(--cc-accent);
    content: '';
    transform: scaleX(0);
    transform-origin: center;
    transition: transform 0.25s ease;
  }

  .cc-nav-link:hover,
  .cc-nav-link:focus-visible {
    color: var(--cc-accent) !important;
    transform: translateY(-1px);
  }

  .cc-nav-link:hover::after,
  .cc-nav-link:focus-visible::after {
    transform: scaleX(1);
  }

  .cc-header-action {
    position: relative;
    min-width: 24px;
    min-height: 44px;
    justify-content: flex-start;
    gap: 7px;
    white-space: nowrap;
    transition:
      color 0.25s ease,
      transform 0.25s ease,
      min-width 0.25s ease;
  }

  .cc-header-action i {
    flex: 0 0 auto;
    font-size: 17px;
    line-height: 1;
    transition: transform 0.25s ease;
  }

  .cc-header-action-label {
    display: inline-block;
    max-width: 0;
    overflow: hidden;
    color: currentColor;
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 0.04em;
    opacity: 0;
    transform: translateX(-5px);
    transition:
      max-width 0.25s ease,
      opacity 0.2s ease,
      transform 0.25s ease;
  }

  .cc-header-action:hover,
  .cc-header-action:focus-visible {
    min-width: 76px;
    color: var(--cc-accent) !important;
    transform: translateY(-2px);
  }

  .cc-header-action:hover i,
  .cc-header-action:focus-visible i {
    transform: translateX(-2px) scale(1.08);
  }

  .cc-header-action:hover .cc-header-action-label,
  .cc-header-action:focus-visible .cc-header-action-label {
    max-width: 52px;
    opacity: 1;
    transform: translateX(0);
  }

  .cc-cart-action:hover,
  .cc-cart-action:focus-visible {
    min-width: 94px;
  }

  .cc-cart-count {
    font-size: 11px;
    line-height: 1;
    transition: color 0.25s ease;
  }

  .cc-header-action:focus-visible {
    outline: 2px solid var(--cc-accent);
    outline-offset: 4px;
  }

  .cc-header-nav > .container-fluid {
      position: relative;
    }

    @media (min-width: 992px) {
      .cc-header-nav .navbar-collapse {
        position: absolute;
        top: 50%;
        left: 50%;
        width: max-content;
        margin: 0 !important;
        transform: translate(-50%, -50%);
      }
    }

    @media (max-width: 991.98px) {
      .cc-header-nav .navbar-collapse {
        position: static;
        width: auto;
        transform: none;
      }
    }

  @media (max-width: 991.98px) {
    .cc-header-action:hover,
    .cc-header-action:focus-visible {
      min-width: 24px;
    }

    .cc-header-action-label {
      display: none;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .cc-header-brand,
    .cc-nav-link,
    .cc-header-action,
    .cc-header-action i,
    .cc-header-action-label,
    .cc-header-menu-toggle,
    .cc-nav-link::after {
      transition: none;
    }

    .cc-header-brand:hover,
    .cc-nav-link:hover,
    .cc-header-action:hover,
    .cc-header-action:hover i,
    .cc-header-menu-toggle:hover {
      transform: none;
    }
  }
</style>

        <!-- Mobile Menu Toggler -->
